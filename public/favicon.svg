<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The म tile. Hard square, Waaree Green, white glyph — the identity's only
       sanctioned icon alongside the outlined M. Never rounded except where a
       platform forces it (app icon, WhatsApp avatar). -->
  <rect width="32" height="32" fill="#007B3C"/>
  <text
    x="16" y="23.5"
    text-anchor="middle"
    font-family="Mukta, 'Nirmala UI', 'Noto Sans Devanagari', sans-serif"
    font-size="23"
    font-weight="800"
    fill="#FFFFFF">म</text>
</svg>
